name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:        # lets you trigger it manually too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend
        run: curl -sf https://rental-gear-fai.onrender.com/api/health || curl -sf https://rental-gear-fai.onrender.com
